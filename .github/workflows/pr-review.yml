name: PR Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  checks: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android Lint
        id: lint
        continue-on-error: true
        run: ./gradlew lintDebug --no-daemon

      - name: Convert lint XML report to checkstyle format
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PYEOF'
          import os
          import xml.etree.ElementTree as ET

          src = "app/build/reports/lint-results-debug.xml"
          ws = os.environ.get("GITHUB_WORKSPACE", os.getcwd())
          out = ET.Element("checkstyle")
          if os.path.exists(src):
              for issue in ET.parse(src).getroot().iter("issue"):
                  sev = issue.get("severity", "Warning").lower()
                  if sev == "fatal":
                      sev = "error"
                  elif sev == "information":
                      sev = "info"
                  for loc in issue.iter("location"):
                      f = loc.get("file", "")
                      if f.startswith(ws):
                          f = os.path.relpath(f, ws).replace(os.sep, "/")
                      if not f or f.startswith("/"):
                          continue
                      fe = ET.SubElement(out, "file", {"name": f})
                      ET.SubElement(fe, "error", {
                          "line": loc.get("line", "1"),
                          "column": loc.get("column", "1"),
                          "severity": sev,
                          "message": ("%s: %s" % (issue.get("summary", ""), issue.get("message", "")))[:500],
                          "source": "AndroidLint:" + issue.get("id", "Lint"),
                      })
          ET.ElementTree(out).write("lint-checkstyle.xml", encoding="utf-8", xml_declaration=True)
          PYEOF

      - name: Setup reviewdog
        if: ${{ !cancelled() }}
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Report lint issues inline via reviewdog
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # diff_context：只对本次 PR 改动涉及的行发行内评论（github-pr-review
          # 只支持 diff 内行内评论；nofilter 会把全仓库问题回退成 Actions 注解
          # 并触发 10+10 上限报错）。全量 lint 统计由下方报告评论承担。
          reviewdog -f=checkstyle \
            -reporter=github-pr-review \
            -filter-mode=diff_context \
            -fail-level=none \
            -name=AndroidLint \
            < lint-checkstyle.xml

      - name: Post review summary comment
        if: ${{ !cancelled() }}
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            const report = 'app/build/reports/lint-results-debug.xml';
            let lintErrors = 0, lintWarnings = 0, lintRan = false;
            const issues = [];
            if (fs.existsSync(report)) {
              lintRan = true;
              const xml = fs.readFileSync(report, 'utf8');
              for (const m of xml.matchAll(/<issue\b([^>]*)>/g)) {
                const attrs = m[1];
                const sev = (attrs.match(/severity="(Error|Warning)"/) || [])[1];
                if (!sev) continue;
                if (sev === 'Error') lintErrors++; else lintWarnings++;
                if (issues.length < 20) {
                  const id = (attrs.match(/ id="([^"]*)"/) || [])[1] || 'Lint';
                  const msg = ((attrs.match(/ message="([^"]*)"/) || [])[1] || '').slice(0, 200);
                  issues.push('| ' + sev + ' | ' + id + ' | ' + msg.replace(/\|/g, '\\|') + ' |');
                }
              }
            }

            const pr = context.payload.pull_request;
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            });
            const changedCount = files.length;
            const additions = files.reduce((s, f) => s + f.additions, 0);
            const deletions = files.reduce((s, f) => s + f.deletions, 0);

            const lintLine = lintRan
              ? 'Android Lint: ' + lintErrors + ' errors, ' + lintWarnings + ' warnings.'
              : 'Android Lint: report not generated (lint step failed, see Actions log).';
            const table = issues.length
              ? ['| Severity | Issue | Message |', '| --- | --- | --- |', ...issues].join('\n')
              : 'No error/warning level lint issues found.';

            const body = [
              '<!-- anycycle-pr-review -->',
              '## AnyCyCle PR 自动审阅报告',
              '',
              '**变更概况**: ' + changedCount + ' files changed, +' + additions + ' / -' + deletions,
              '',
              '**Lint 摘要**: ' + lintLine,
              '',
              table,
              '',
              '### 代码审查要点清单',
              '',
              '- [ ] 每个 Xposed hook 均有 try-catch 保护，异常不会导致 SystemUI 崩溃',
              '- [ ] SystemUI 进程内加载与自绘的类（如 SignalRingView）保持纯 Java，不依赖 Kotlin Intrinsics',
              '- [ ] 配置键（AnyCyCleConfig 常量）在模块 App 与 Hook 两端保持一致',
              '- [ ] 未修改 keystore/ 与 keystore.properties 等签名相关文件',
              '',
              '---',
              '_本评论由 PR Review workflow 自动生成，失败不影响合并。_'
            ].join('\n');

            const marker = '<!-- anycycle-pr-review -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body
              });
            }
